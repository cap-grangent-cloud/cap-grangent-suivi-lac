
name: Collecte quotidienne Grangent

on:
  schedule:
    - cron: '0 8 * * *'
      timezone: 'Europe/Paris'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collecte-grangent
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer les fichiers
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collecter le niveau du lac
        env:
          GRANGENT_SOURCE_URL: ${{ secrets.GRANGENT_SOURCE_URL }}
          GRANGENT_JSON_LEVEL_KEY: ${{ secrets.GRANGENT_JSON_LEVEL_KEY }}
        run: python collect.py

      - name: Enregistrer les releves
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/releves.json
          if ! git diff --cached --quiet; then
            git commit -m "Mise a jour niveau du lac"
            git push
          fi
